name: PowerShell validation

on:
  push:
    branches: [main]
    paths:
      - '**.ps1'
      - '**.psd1'
      - '**.md'
      - '**.csv'
      - '.github/workflows/powershell-validation.yml'
  pull_request:
    paths:
      - '**.ps1'
      - '**.psd1'
      - '**.md'
      - '**.csv'
      - '.github/workflows/powershell-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Parse, analyse and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install validation modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run error-severity static analysis
        shell: pwsh
        run: |
          # The excluded rule flags controlled conversion of runtime-generated
          # passwords and Graph access tokens. No reusable secret is stored in
          # the repository, and every other error-severity rule remains active.
          $Findings = @(
              Invoke-ScriptAnalyzer `
                  -Path ./scripts `
                  -Recurse `
                  -Severity Error `
                  -ExcludeRule PSAvoidUsingConvertToSecureStringWithPlainText
          )
          $Findings | Format-Table -AutoSize
          if ($Findings.Count -gt 0) {
              throw "PSScriptAnalyzer returned $($Findings.Count) error-severity finding(s)."
          }

      - name: Run safe repository tests
        shell: pwsh
        run: |
          $Configuration = New-PesterConfiguration
          $Configuration.Run.Path = './tests'
          $Configuration.Run.PassThru = $true
          $Configuration.Output.Verbosity = 'Detailed'
          $Result = Invoke-Pester -Configuration $Configuration
          if ($Result.FailedCount -gt 0) {
              throw "$($Result.FailedCount) Pester test(s) failed."
          }

